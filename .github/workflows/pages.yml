name: Deploy showcase to GitHub Pages

on:
  push:
    branches: [main, master]
    paths:
      - "site/**"
      - "frontend/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install demo dependencies
        run: npm ci --prefix frontend

      - name: Build interactive demo
        env:
          DEMO_BASE: /${{ github.event.repository.name }}/demo/
        run: npm run build --prefix frontend -- --base="$DEMO_BASE"

      - name: Assemble static site
        env:
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
        run: |
          rm -rf _site
          mkdir -p _site
          cp -R site/. _site/
          mkdir -p _site/demo
          cp -R frontend/dist/. _site/demo/
          touch _site/.nojekyll
          find _site -name '*.html' -print0 \
            | xargs -0 -r sed -i \
              -e "s|__REPO_URL__|${REPO_URL}|g" \
              -e "s|__BRANCH__|${BRANCH}|g"
          echo "Assembled:" && find _site -maxdepth 2 -type f | sort

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
